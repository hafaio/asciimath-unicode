# Build a tagged version of the keyboard's installers, the Mac's signed and notarized, and attach
# both to one GitHub release; safe to rerun on the same tag.
name: keyboard-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. keyboard-v1.2.3)
        required: true
        type: string

permissions: {}

jobs:
  mac:
    runs-on: macos-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: keyboard-mac
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-apple-darwin, x86_64-apple-darwin
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    - name: import the signing certificates
      env:
        # a .p12 holding the Developer ID Application and Developer ID Installer certificates
        CERTIFICATES: ${{ secrets.MACOS_CERTIFICATES }}
        CERTIFICATES_PASSWORD: ${{ secrets.MACOS_CERTIFICATES_PASSWORD }}
      run: |
        if [ -z "$CERTIFICATES" ]; then
          echo "::error::the MACOS_CERTIFICATES secret is not set; an unsigned installer is not worth releasing"
          exit 1
        fi
        password=$(uuidgen)
        security create-keychain -p "$password" "$RUNNER_TEMP/signing.keychain-db"
        security set-keychain-settings -lut 3600 "$RUNNER_TEMP/signing.keychain-db"
        security unlock-keychain -p "$password" "$RUNNER_TEMP/signing.keychain-db"
        echo "$CERTIFICATES" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
        security import "$RUNNER_TEMP/certificates.p12" -k "$RUNNER_TEMP/signing.keychain-db" -P "$CERTIFICATES_PASSWORD" \
          -T /usr/bin/codesign -T /usr/bin/pkgbuild -T /usr/bin/productsign
        rm "$RUNNER_TEMP/certificates.p12"
        security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$RUNNER_TEMP/signing.keychain-db"
        # the archive step's packaging looks for the installer identity in the search list
        security list-keychains -d user -s "$RUNNER_TEMP/signing.keychain-db" login.keychain-db
    - name: archive, which also builds the installer
      env:
        TEAM: ${{ secrets.APPLE_TEAM_ID }}
      run: |
        xcodebuild -quiet -project AsciiMathUnicode.xcodeproj -scheme AsciiMathUnicode \
          -derivedDataPath build -archivePath build/AsciiMathUnicode.xcarchive archive \
          CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="Developer ID Application" DEVELOPMENT_TEAM="$TEAM" \
          OTHER_CODE_SIGN_FLAGS=--timestamp ENABLE_HARDENED_RUNTIME=YES CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO
    - name: find the installer
      id: installer
      # packaging runs after the archive, where a failure doesn't fail the build
      run: |
        built=$(ls build/AsciiMathUnicode-*.pkg) || { cat build/package.log; exit 1; }
        pkgutil --check-signature "$built"
        # one name for every version, so the latest release's download address never changes
        mv "$built" build/AsciiMathUnicode.pkg
        echo "path=keyboard-mac/build/AsciiMathUnicode.pkg" >> "$GITHUB_OUTPUT"
    - name: notarize
      env:
        API_KEY_BASE64: ${{ secrets.APPLE_API_KEY }}
        API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
        API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        installer: ${{ github.workspace }}/${{ steps.installer.outputs.path }}
      run: |
        echo "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
        xcrun notarytool submit "$installer" --key "$RUNNER_TEMP/notary.p8" --key-id "$API_KEY_ID" \
          --issuer "$API_ISSUER_ID" --wait
        xcrun stapler staple "$installer"
    - uses: actions/upload-artifact@v7
      with:
        name: mac
        path: ${{ steps.installer.outputs.path }}
        if-no-files-found: error
    - name: remove the signing material
      if: always()
      run: |
        security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
        rm -f "$RUNNER_TEMP/notary.p8"

  windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
    - uses: Swatinem/rust-cache@v2
    - name: take the version from the tag
      shell: bash
      env:
        tag: ${{ inputs.tag }}
      run: |
        version="${tag#keyboard-v}"
        if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          echo "::error::$tag is not a tag like keyboard-v1.2.3"
          exit 1
        fi
        # the build scripts of the library and the program read this
        echo "KEYBOARD_VERSION=$version" >> "$GITHUB_ENV"
    - run: cargo build --release --target x86_64-pc-windows-msvc -p keyboard-windows-tip -p keyboard-windows-app
    - run: cargo build --release --target i686-pc-windows-msvc -p keyboard-windows-tip
    # OPTIONAL SIGNING, off unless the repository variable WINDOWS_SIGNING is set to something
    # other than `none`. Nothing is signed yet: to start, replace this step with one that signs
    # both copies of asciimath_unicode_tip.dll and AsciiMathUnicode.exe under target/, and the
    # step after the installer is built with one that signs target/installer/AsciiMathUnicode.msi.
    - name: sign the library and the program (not set up)
      if: vars.WINDOWS_SIGNING != '' && vars.WINDOWS_SIGNING != 'none'
      shell: bash
      run: |
        echo "::error::WINDOWS_SIGNING is set, but signing is not set up in this workflow"
        exit 1
    - run: dotnet build keyboard-windows/installer -c Release "-p:Version=$env:KEYBOARD_VERSION"
    - name: sign the installer (not set up)
      if: vars.WINDOWS_SIGNING != '' && vars.WINDOWS_SIGNING != 'none'
      shell: bash
      run: |
        echo "::error::WINDOWS_SIGNING is set, but signing is not set up in this workflow"
        exit 1
    - uses: actions/upload-artifact@v7
      with:
        name: windows
        path: target/installer/AsciiMathUnicode.msi
        if-no-files-found: error

  publish:
    needs: [ mac, windows ]
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub release
    steps:
    - uses: actions/download-artifact@v8
      with:
        merge-multiple: true
    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        tag: ${{ inputs.tag }}
      # both installers at once, so the latest release never lacks one of them
      run: |
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" AsciiMathUnicode.pkg AsciiMathUnicode.msi --clobber
        else
          gh release create "$tag" --generate-notes --verify-tag --latest AsciiMathUnicode.pkg AsciiMathUnicode.msi
        fi
