# Build a tagged version of the extension and attach it to a GitHub release; safe to rerun on the same tag.
name: ext-release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag to publish (e.g. extension-v1.2.3)
        required: true
        type: string

permissions:
  contents: write # create the GitHub release

defaults:
  run:
    working-directory: extension

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ inputs.tag }}
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2.87.21
      with:
        tool: wasm-pack
    - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
    - run: bun install --frozen-lockfile
    - run: bun export
    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
        tag: ${{ inputs.tag }}
      run: |
        if gh release view "$tag" > /dev/null 2>&1; then
          gh release upload "$tag" asciimath-unicode.zip --clobber
        else
          # the repo's "latest" release is always the keyboard's, which is downloaded from here
          gh release create "$tag" --generate-notes --verify-tag --latest=false asciimath-unicode.zip
        fi
