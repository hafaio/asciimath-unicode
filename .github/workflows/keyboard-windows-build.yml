name: keyboard-windows-build
on: [ push, pull_request, workflow_call ]

jobs:
  core:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    - run: cargo fmt --all --check
    - run: cargo clippy --workspace --all-targets -- -D warnings
    - run: cargo test --workspace

  windows:
    runs-on: windows-latest
    env:
      # no release has a version this low, and each run's differs from the last
      KEYBOARD_VERSION: 0.0.${{ github.run_number }}

    steps:
    - uses: actions/checkout@v7
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
        targets: x86_64-pc-windows-msvc, i686-pc-windows-msvc
    - uses: Swatinem/rust-cache@v2
    - run: cargo clippy --target x86_64-pc-windows-msvc -p keyboard-windows-tip -p keyboard-windows-app --all-targets -- -D warnings
    - run: cargo clippy --target i686-pc-windows-msvc -p keyboard-windows-tip -p keyboard-windows-app --all-targets -- -D warnings
    - run: cargo build --target x86_64-pc-windows-msvc -p keyboard-windows-tip
    - run: cargo test --target x86_64-pc-windows-msvc -p keyboard-windows-tip -p keyboard-windows-app
    - run: cargo build --target i686-pc-windows-msvc -p keyboard-windows-tip
    - run: cargo test --target i686-pc-windows-msvc -p keyboard-windows-tip -p keyboard-windows-app
    - run: cargo build --release --target x86_64-pc-windows-msvc -p keyboard-windows-tip -p keyboard-windows-app
    - run: cargo build --release --target i686-pc-windows-msvc -p keyboard-windows-tip
    - run: dotnet build keyboard-windows/installer -c Release "-p:Version=$env:KEYBOARD_VERSION"
    # what someone trying the keyboard on Windows downloads
    - uses: actions/upload-artifact@v7
      with:
        name: keyboard-windows-installer
        path: target/installer/AsciiMathUnicode.msi
        if-no-files-found: error
    - name: install
      run: |
        $install = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
          '/i', 'target\installer\AsciiMathUnicode.msi', '/qn', '/norestart', '/l*v', 'install.log'
        if ($install.ExitCode -ne 0) {
          Get-Content install.log
          exit $install.ExitCode
        }
    # the installed keyboard, as a 64-bit and as a 32-bit app find it
    - run: cargo test --target x86_64-pc-windows-msvc -p keyboard-windows-tip --test installed -- --ignored --exact present
    - run: cargo test --target i686-pc-windows-msvc -p keyboard-windows-tip --test installed -- --ignored --exact present
    - name: uninstall
      run: |
        $uninstall = Start-Process msiexec.exe -Wait -PassThru -ArgumentList `
          '/x', 'target\installer\AsciiMathUnicode.msi', '/qn', '/norestart', '/l*v', 'uninstall.log'
        if ($uninstall.ExitCode -ne 0) {
          Get-Content uninstall.log
          exit $uninstall.ExitCode
        }
        if ((Test-Path "$env:ProgramFiles\Ascii Math Unicode") -or (Test-Path "${env:ProgramFiles(x86)}\Ascii Math Unicode")) {
          Write-Output '::error::the uninstall left files behind'
          exit 1
        }
    - run: cargo test --target x86_64-pc-windows-msvc -p keyboard-windows-tip --test installed -- --ignored --exact gone
    - run: cargo test --target i686-pc-windows-msvc -p keyboard-windows-tip --test installed -- --ignored --exact gone
