name: release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: semver bump
        type: choice
        options: [ patch, minor, major ]
        default: patch

permissions:
  contents: write

jobs:
  gate:
    uses: ./.github/workflows/build.yml

  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.3.14
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - uses: Swatinem/rust-cache@v2
    - uses: taiki-e/install-action@v2
      with:
        tool: wasm-pack
    - run: sudo apt-get update && sudo apt-get install -y librsvg2-bin
    - run: bun install --frozen-lockfile
    - name: bump version
      id: bump
      # manifest.json is the version source of truth; package.json stays 0.0.0 (private, unpublished)
      run: |
        version=$(bun --print '(() => {
          const fs = require("fs");
          const manifest = JSON.parse(fs.readFileSync("manifest.json"));
          const parts = manifest.version.split(".").map(Number);
          const bump = "${{ inputs.bump }}";
          if (bump === "major") { parts[0]++; parts[1] = 0; parts[2] = 0; }
          else if (bump === "minor") { parts[1]++; parts[2] = 0; }
          else { parts[2]++; }
          manifest.version = parts.join(".");
          fs.writeFileSync("manifest.json", JSON.stringify(manifest, null, "\t") + "\n");
          return manifest.version;
        })()')
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - run: bun run pack
    - name: commit, tag, and push
      run: |
        git config user.name 'github-actions[bot]'
        git config user.email 'github-actions[bot]@users.noreply.github.com'
        git commit -am "v${{ steps.bump.outputs.version }}"
        git tag "v${{ steps.bump.outputs.version }}"
        git push --follow-tags
    - name: create release
      env:
        GH_TOKEN: ${{ github.token }}
      run: gh release create "v${{ steps.bump.outputs.version }}" --generate-notes asciimath-unicode.zip
